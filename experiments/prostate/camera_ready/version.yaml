# Camera-ready (reviewer-response) suite: controls and ablations of the BAP-MOS inner loop.
#
# Every variant starts from the production inner loop (experiments/prostate/bapmos/
# inner_loop/version.yaml) with the paper's TPE trial-61 parameters (selected/paper_tpe/)
# and changes one thing through its experiment ``overrides``. Three seeds per variant (docs/SEEDS.md).
#
#   python -m bapmos.method.bap_mos_trainer --version bapmos_camera_ready \
#     --dataset pooled --experiment global_seed42 --run-name global_seed42
#
# LOCO variants need the split lists first:
#   python -m bapmos.preprocess.prostate.create_loco_splits
#
# Runs land under runs/prostate/camera_ready/<experiment>/.

ablation:
  version: bapmos_camera_ready
  id: camera_ready
  parameter_source: bayesian_selected
  # Paper configuration (TPE trial 61): selected/paper_tpe/pooled.yaml in this suite.
  description: "Reviewer-response controls and ablations on the BAP-MOS inner loop"

run_root: runs/prostate/camera_ready

common:
  data_root: data/prostate/pooled
  splits_subdir: splits_stratified
  sam_checkpoint: models/sam_base/sam_vit_b_01ec64.pth
  max_epochs: 300
  batch_size: 1
  lr: 1.0e-4
  patience: 40
  num_workers: 0
  pixel_spacing: [0.159072, 0.159072]
  # Frozen-encoder embeddings computed once (bapmos.preprocess.prostate.precompute_sam_embeddings);
  # prostate training has no image augmentation, so the cache equals on-the-fly encoding.
  use_cached_image_embeddings: true
  image_embedding_dir: data/prostate/pooled/sam_vit_b_embeddings

# Default hyperparameters = searched_clip_scale_organ enqueue baseline.
# After outer-loop export, prefer compose (defaults to selected/tpe) or
# BAPMOS_SELECTED_SUBDIR=selected/<method>, or paste exported blocks into this file.

reward:
  mode: composite_fixed_clip
  clip_max_mm: 20.0
  hd95_lambda: 3.0

prompt_geometry:
  ring_mode: scale_organ
  alpha: 0.1
  r_min: 6
  num_pos: 1
  num_neg: 3
  box_jitter_px: 2

bandit:
  memory: sliding
  window_size: 50
  block_size_batches: 50
  arms: [box, point, both]
  warmup_blocks_per_arm: 10
  min_pulls_per_arm: 5
  probe_size: 20
  probe_seed: 42

training:
  loss_mode: kervadec
  kervadec:
    alpha_start: 1.0
    alpha_end: 0.5
    alpha_schedule: linear

wandb:
  enabled: true
  tags: [BAP-MOS, camera_ready, kervadec, ptv_kfold, prostate]

evaluation:
  run_test_after_train: false
  # The per-epoch train-set metrics pass is logging only (nothing selects on it); off for
  # every camera-ready run to halve epoch time.
  eval_train_metrics: false
  # Production keeps checkpoints; only outer_loop HPO deletes trial .pth after scoring.
  cleanup_checkpoints_after_train: false
  objective_metric: ptv_kfold_msd
  kfold_n: 5
  kfold_seed: 42

experiments:
- name: reference_seed42
  seed: 42
  overrides:
    ablation:
      variant: reference
      variant_description: BAP-MOS rerun (per-organ UCB-Tuned); the reference row
- name: reference_seed43_rep2
  seed: 43
  overrides:
    ablation:
      variant: reference
      variant_description: BAP-MOS rerun (per-organ UCB-Tuned); the reference row
- name: reference_seed44_rep3
  seed: 44
  overrides:
    ablation:
      variant: reference
      variant_description: BAP-MOS rerun (per-organ UCB-Tuned); the reference row
- name: global_seed42
  seed: 42
  overrides:
    ablation:
      variant: global
      variant_description: One shared UCB-Tuned selector for all organs
    bandit: &id001
      scope: global
- name: global_seed43_rep2
  seed: 43
  overrides:
    ablation:
      variant: global
      variant_description: One shared UCB-Tuned selector for all organs
    bandit: *id001
- name: global_seed44_rep3
  seed: 44
  overrides:
    ablation:
      variant: global
      variant_description: One shared UCB-Tuned selector for all organs
    bandit: *id001
- name: fixed_235_seed42
  seed: 42
  overrides:
    ablation:
      variant: fixed_235
      variant_description: Fixed Box:Point:Both = 2:3:5 schedule under the BAP-MOS protocol
    bandit: &id002
      scope: fixed
      fixed_weights:
        box: 2
        point: 3
        both: 5
- name: fixed_235_seed43_rep2
  seed: 43
  overrides:
    ablation:
      variant: fixed_235
      variant_description: Fixed Box:Point:Both = 2:3:5 schedule under the BAP-MOS protocol
    bandit: *id002
- name: fixed_235_seed44_rep3
  seed: 44
  overrides:
    ablation:
      variant: fixed_235
      variant_description: Fixed Box:Point:Both = 2:3:5 schedule under the BAP-MOS protocol
    bandit: *id002
- name: box_only_seed42
  seed: 42
  overrides:
    ablation:
      variant: box_only
      variant_description: Box prompts only under the BAP-MOS protocol (matched SAM-box control)
    bandit: &id003
      arms:
      - box
- name: box_only_seed43_rep2
  seed: 43
