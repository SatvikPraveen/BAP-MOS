name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-hpo.txt

      # CPU wheels of the pinned torch / torchvision keep the job small; they satisfy the
      # exact pins in requirements.txt, which is installed next.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.13.0 torchvision==0.28.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -r requirements-hpo.txt pytest==9.0.3

      - name: Run tests
        run: python -m pytest -q
